name: Build for VPS

on:
  push:
    branches: [content-ops-v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vps-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BUILD_STANDALONE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble standalone output
        run: |
          set -e
          mkdir -p out/.next
          cp -r .next/standalone/. out/
          cp -r .next/static out/.next/static
          if [ -d public ]; then cp -r public out/public; fi
          find out -name .gitignore -not -path '*/node_modules/*' -delete
          cat > out/Dockerfile <<'DOCKER'
          FROM node:24-alpine
          WORKDIR /app
          ENV NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0 NEXT_TELEMETRY_DISABLED=1
          COPY . .
          EXPOSE 3000
          CMD ["node", "server.js"]
          DOCKER
          sed -i 's/^          //' out/Dockerfile

      - name: Publish to vps-build branch
        run: |
          cd out
          git init -q -b vps-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -qm "VPS build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" vps-build
